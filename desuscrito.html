<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darse de baja - La Palma Princess</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:32rem;margin:4rem auto;padding:0 1rem;color:#12303a}
    button{padding:.7em 1.4em;border:0;border-radius:999px;background:#f2b84b;font:700 1rem system-ui;cursor:pointer}
  </style>
</head>
<body>
  <h1>Darse de baja</h1>
  <p id="texto">Cargando…</p>
  <button id="confirmar" hidden>Confirmar baja</button>
  <script>
    const API = 'https://asistente-princess.onrender.com';
    const email = new URLSearchParams(location.search).get('email');
    const texto = document.getElementById('texto');
    const boton = document.getElementById('confirmar');
    if (!email) {
      texto.textContent = 'Falta el email en el enlace.';
    } else {
      texto.textContent = '¿Quieres dejar de recibir las novedades en ' + email + '?';
      boton.hidden = false;
      boton.addEventListener('click', function () {
        boton.disabled = true;
        fetch(API + '/api/newsletter/unsubscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        })
          .then(function (r) { return r.json(); })
          .then(function (d) { texto.textContent = d.message || 'Listo.'; boton.hidden = true; })
          .catch(function () { texto.textContent = 'No se pudo completar la baja. Inténtalo de nuevo.'; boton.disabled = false; });
      });
    }
  </script>
</body>
</html>
